<!DOCTYPE html>
<html>
<head>
<title>Healthcare Analytics Pipeline</title>

<style>

body{
font-family: Arial;
background:#f4f6f8;
text-align:center;
}

h1{
color:#2c3e50;
}

.container{
width:80%;
margin:auto;
}

.box{
background:white;
padding:20px;
margin:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
padding:10px 20px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

</style>

</head>

<body>

<h1>Healthcare Analytics Data Pipeline</h1>

<div class="container">

<div class="box">
<h2>Upload Healthcare Data</h2>
<p>Upload patient dataset to S3</p>
<button onclick="alert('Data uploaded to AWS S3')">
Upload Dataset
</button>
</div>

<div class="box">
<h2>Run ETL Pipeline</h2>
<p>Trigger Lambda ETL Processing</p>
<button onclick="alert('ETL Pipeline Triggered')">
Run ETL
</button>
</div>

<div class="box">
<h2>Snowflake Analytics</h2>
<p>View analytics results</p>
<button onclick="alert('Connecting to Snowflake Warehouse')">
View Dashboard
</button>
</div>

<div class="box">
<h2>Pipeline Architecture</h2>

<p>

Data Source → S3 → Lambda ETL → Processed S3 → Snowflake → BI Dashboard

</p>

</div>

</div>

</body>
</html>
